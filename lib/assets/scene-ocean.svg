<?xml version="1.0" encoding="UTF-8"?>
<!--
  Placeholder scene backdrop for the Conversation chrome.

  Replace this file to swap the scene only; the character image and the frosted
  reading surface are independent assets, so each layer changes on its own.
  Deep-sea blue gradient kept in step with the character palette.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="deep" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#0d1b3e"/>
      <stop offset="0.55" stop-color="#142a55"/>
      <stop offset="1" stop-color="#1a2b52"/>
    </linearGradient>
    <radialGradient id="shaft" cx="0.72" cy="0.08" r="0.62">
      <stop offset="0" stop-color="#7fb6ff" stop-opacity="0.28"/>
      <stop offset="0.6" stop-color="#4a7fd4" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#4a7fd4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="floor" cx="0.5" cy="1" r="0.75">
      <stop offset="0" stop-color="#2a4a86" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#0a1530" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#deep)"/>
  <rect width="1600" height="1000" fill="url(#shaft)"/>
  <rect width="1600" height="1000" fill="url(#floor)"/>

  <!-- Faint light shafts falling from the surface. -->
  <g fill="#9ecbff" opacity="0.07">
    <polygon points="1180,0 1275,0 1085,1000 940,1000"/>
    <polygon points="1320,0 1362,0 1230,1000 1160,1000"/>
    <polygon points="1010,0 1052,0 900,1000 830,1000"/>
  </g>

  <!-- Distant surface shimmer. -->
  <g fill="#cfe6ff" opacity="0.12">
    <ellipse cx="1240" cy="34" rx="220" ry="26"/>
    <ellipse cx="900" cy="18" rx="150" ry="16"/>
  </g>
</svg>
